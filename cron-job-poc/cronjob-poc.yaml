apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello-cron
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: hello
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - date; echo "Hello from Kubernetes CronJob"
          restartPolicy: Never
