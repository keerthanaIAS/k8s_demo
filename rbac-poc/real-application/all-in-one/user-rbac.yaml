apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-service
  namespace: production-poc

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: user-service-role
  namespace: production-poc
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: user-service-binding
  namespace: production-poc
subjects:
  - kind: ServiceAccount
    name: user-service
    namespace: production-poc
roleRef:
  kind: Role
  name: user-service-role
  apiGroup: rbac.authorization.k8s.io