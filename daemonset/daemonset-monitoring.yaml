apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent

spec:
  selector:
    matchLabels:
      app: node-agent

  template:
    metadata:
      labels:
        app: node-agent

    spec:
      containers:
        - name: agent
          image: busybox:1.36

          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          command:
            - /bin/sh
            - -c
            - |
              while true
              do
                echo "=============================="
                echo "Monitoring Node: $NODE_NAME"
                echo "Time: $(date)"
                echo "Memory:"
                free
                echo "CPU Load:"
                cat /proc/loadavg
                echo "=============================="
                sleep 30
              done


