apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: multi-cluster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: nginx
          ports:
            - containerPort: 80