apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-from-clusterrole
  namespace: rbac-test  # namespace 1

subjects:
  - kind: ServiceAccount
    name: developer
    namespace: rbac-poc # namespace 2

roleRef:
  kind: ClusterRole
  name: pod-reader-clusterrole
  apiGroup: rbac.authorization.k8s.io