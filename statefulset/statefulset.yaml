apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo-statefulset
spec:
  serviceName: demo-service
  replicas: 3

  selector:
    matchLabels:
      app: demo

  template:
    metadata:
      labels:
        app: demo

    spec:
      containers:
        - name: demo-container
          image: nginx:latest

          ports:
            - containerPort: 80

          volumeMounts:
            - name: demo-storage
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: demo-storage

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 1Gi