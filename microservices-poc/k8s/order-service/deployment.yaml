apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: microservices-poc

spec:
  replicas: 2

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
        - name: order-service

          image: YOUR_DOCKERHUB_USERNAME/order-service:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 3001

          env:
            - name: MONGO_URL
              value: "mongodb://mongodb:27017"

            - name: KAFKA_BROKER
              value: "kafka-0.kafka:9092"