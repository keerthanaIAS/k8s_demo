apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: csi-demo-pvc
  namespace: admission-poc
spec:
  storageClassName: csi-hostpath-sc
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

# One sentence to remember:
# PV = Kubernetes representation of storage.
# CSI = how Kubernetes talks to the storage backend.
# Actual data = stored in the backend, not inside the PV object.