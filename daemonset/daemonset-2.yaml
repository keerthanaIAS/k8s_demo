# Next: make the Pod know its actual Kubernetes node
# -------------------------------------------------
# We'll use Kubernetes' Downward API.

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent

spec:
  selector:
    matchLabels:
      app: node-agent

  template:
    metadata:
      labels:
        app: node-agent

    spec:
      containers:
        - name: agent
          image: busybox:1.36

          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          command:
            - /bin/sh
            - -c
            - |
              echo "Node-level agent started"
              echo "Kubernetes Node: $NODE_NAME"
              sleep 3600

          restartPolicy: Always

# You have:

# minikube       → node-agent-6f68f
# minikube-m02   → node-agent-4lxg8

# And each Pod knows its actual Kubernetes node:

# node-agent-4lxg8 → Kubernetes Node: minikube-m02
# node-agent-6f68f  → Kubernetes Node: minikube

# we proved
# ---------
# DaemonSet
#    ↓
# Checks eligible nodes
#    ↓
# Creates 1 Pod on each node
#    ↓
# Each agent knows which node it belongs to

#  So this is why we call it a node-level workload: the agent is deployed per node, 
# like a monitoring/logging agent that needs to operate on every node.



# in this yaml file we done:
# --------------------------
# What we have done so far was only the foundation:

# DaemonSet runs one agent Pod per node ✅
# Agent can identify its Kubernetes node ✅
