apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 4 # I want 4 Pods running.

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
        - name: user-service
          image: user-service:v1 # Run my Docker image.
          imagePullPolicy: Never # Don't try to pull user-service:v1 from Docker Hub. Use the image already available on the node.

          ports:
            - containerPort: 3000